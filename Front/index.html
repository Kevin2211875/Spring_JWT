<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="css/login.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col s12 m6 offset-m3">
                <div class="card">
                    <form id="loginForm" method="POST">
                        <div class="card-content center">
                            <img src="img/MisionTIC-UIS.png" alt="Logo" />
                            <span class="card-title">INICIAR SESIÓN</span>
                            <div class="row">
                                <div class="input-field col s12">
                                    <i class="material-icons prefix">account_circle</i>
                                    <input id="email" type="email" name="email" required>
                                    <label for="email">Correo Electrónico</label>
                                </div>
                                <div class="input-field col s12">
                                    <i class="material-icons prefix">lock</i>
                                    <input id="password" type="password" name="password" required>
                                    <label for="password">Contraseña</label>
                                </div>
                            </div>
                            <div id="message" class="message"></div>
                        </div>
                        <div class="card-action center">
                            <button type="submit" class="btn btn-large">
                                Ingresar<i class="material-icons right">directions_run</i>
                            </button>
                            <div style="margin-top: 10px;">
                                <a class="card-title activator grey-text text-darken-4" href="register.html">REGÍSTRATE</a>
                            </div>
                        </div>
                    </form>
                    <div id="userInfo" class="user-info card-reveal" style="display: none;">
                        <span class="card-title grey-text text-darken-4">Información del Usuario
                            <i class="material-icons right">close</i>
                        </span>
                        <p><strong>Nombre:</strong> <span id="userName"></span></p>
                        <p><strong>Email:</strong> <span id="userEmail"></span></p>
                        <button id="logoutBtn" class="btn red">Cerrar Sesión</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Materialize & Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
